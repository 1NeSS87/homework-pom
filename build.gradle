plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}
repositories {
    mavenCentral()
}
dependencies {
    // JUnit
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Selenide
    testImplementation 'com.codeborne:selenide:7.19.1'
    // Allure
    testImplementation platform('io.qameta.allure:allure-bom:3.0.0')
    testImplementation 'io.qameta.allure:allure-jupiter'
    testImplementation 'io.qameta.allure:allure-selenide'
}
tasks.test {
    useJUnitPlatform()
}